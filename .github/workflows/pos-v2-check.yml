name: POS V1 checks

on:
  push:
    branches: [release-v1-polish, final-pos-fixes, release/windows-offline-first, main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          find js electron scripts -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Check release assets
        run: |
          test -f index.html
          test -f css/style.css
          test -f assets/img/loto-games-logo.svg
          grep -q 'assets/img/loto-games-logo.svg' index.html
          grep -q 'Loto Games · ERP / POS' index.html
          grep -q 'js/cloud-auth.js' index.html
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('assets/img/loto-games-logo.svg')
          print('SVG OK')
          PY

      - name: Check Supabase migrations
        run: |
          test -f supabase/migrations/20260818_pos_final.sql
          test -f supabase/migrations/20260818_ventas_descuento.sql
          test -f supabase/migrations/20260818_productos_markup5.sql
          test -f supabase/migrations/20260818_v1_schema_final.sql
          test -f supabase/migrations/20260903_windows_offline_bigint.sql
          test -f supabase/migrations/20260903_secure_cloud_sync_rls.sql

      - name: Static smoke test
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/loto-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8080/ >/dev/null
          curl -fsS http://127.0.0.1:8080/css/style.css >/dev/null
          curl -fsS http://127.0.0.1:8080/assets/img/loto-games-logo.svg >/dev/null
