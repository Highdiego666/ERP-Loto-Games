name: POS V2 checks

on:
  push:
    branches: [final-pos-fixes, main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
