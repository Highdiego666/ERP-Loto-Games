name: Windows candidate build

on:
  push:
    branches: [vnext/windows-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci

      - name: Mark candidate as 0.9.0
        shell: pwsh
        run: npm version 0.9.0 --no-git-tag-version

      - name: Validate application
        shell: pwsh
        run: |
          npm run vendor
          $files = Get-ChildItem js,electron,scripts -Recurse -File | Where-Object { $_.Extension -in '.js','.cjs','.mjs' }
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/validate-release.mjs

      - name: Build NSIS candidate installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: LotoGames-0.9.0-Windows-x64-candidate
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
