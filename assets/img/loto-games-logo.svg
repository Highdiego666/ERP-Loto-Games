<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Loto Games</title>
  <desc id="desc">Logotipo Loto Games en rojo, azul y amarillo con mando de videojuego.</desc>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4a3f"/>
      <stop offset="0.48" stop-color="#f5221f"/>
      <stop offset="1" stop-color="#b80f17"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d8cff"/>
      <stop offset="0.5" stop-color="#1358e9"/>
      <stop offset="1" stop-color="#0631a9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#000" flood-opacity=".7"/>
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff271f" flood-opacity=".55"/>
    </filter>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#1f69ff" flood-opacity=".6"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" transform="rotate(-5 490 260)">
    <text x="55" y="245" font-family="Arial Black, Impact, sans-serif" font-size="205" font-style="italic" font-weight="900" letter-spacing="-15" fill="#8c0d14" stroke="#501016" stroke-width="18">LOTO</text>
    <text x="55" y="232" font-family="Arial Black, Impact, sans-serif" font-size="205" font-style="italic" font-weight="900" letter-spacing="-15" fill="url(#red)" stroke="#ffddd8" stroke-width="7" paint-order="stroke" filter="url(#glowRed)">LOTO</text>
    <path d="M650 150 C700 113 760 115 810 151 L885 174 C922 185 947 220 943 257 L937 303 C934 337 905 363 870 360 L825 356 C804 354 784 344 769 329 L738 298 H686 L653 331 C639 345 621 354 601 356 L563 360 C530 363 502 337 499 304 L494 259 C490 224 512 191 546 177 L607 153 C621 147 636 147 650 150 Z" fill="url(#red)" stroke="#ffddd8" stroke-width="7" filter="url(#glowRed)"/>
    <rect x="620" y="196" width="93" height="30" rx="15" fill="#4f1316"/>
    <rect x="579" y="226" width="22" height="84" rx="8" fill="#ffd21a"/>
    <rect x="548" y="257" width="84" height="22" rx="8" fill="#ffd21a"/>
    <circle cx="831" cy="232" r="20" fill="#ffd21a"/>
    <circle cx="878" cy="258" r="20" fill="#ffd21a"/>
    <circle cx="829" cy="285" r="20" fill="#ffd21a"/>
    <circle cx="784" cy="259" r="20" fill="#ffd21a"/>
    <path d="M817 151 C842 96 898 82 945 115 C968 132 976 158 975 187" fill="none" stroke="#1f69ff" stroke-width="16" stroke-linecap="round" filter="url(#glowBlue)"/>
    <path d="M974 187 C972 211 976 232 969 249" fill="none" stroke="#1f69ff" stroke-width="16" stroke-linecap="round"/>

    <text x="145" y="425" font-family="Arial Black, Impact, sans-serif" font-size="180" font-style="italic" font-weight="900" letter-spacing="-12" fill="#061c70" stroke="#04154e" stroke-width="18">GAMES</text>
    <text x="145" y="410" font-family="Arial Black, Impact, sans-serif" font-size="180" font-style="italic" font-weight="900" letter-spacing="-12" fill="url(#blue)" stroke="#68b1ff" stroke-width="7" paint-order="stroke" filter="url(#glowBlue)">GAMES</text>
  </g>
</svg>
